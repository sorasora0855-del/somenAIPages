<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>somenAI</title>
  <link rel="stylesheet" href="style.css?v=ui5">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">somenAI</div>
    <button id="newChat" class="new-chat">＋ 新しいチャット</button>
    <div id="chatList" class="chat-list"></div>
    <div class="sidebar-footer">
      <button id="settings" class="footer-button">⚙️ 設定</button>
      <button id="logout" class="footer-button">ログアウト</button>
    </div>
  </aside>
  <div id="mobileBackdrop"></div>
  <main>
    <header>
      <button id="mobileMenu" class="menu-button" aria-label="メニュー">☰</button>
      <b>somenAI</b>
      <button id="mobileSettings" class="mobile-settings" aria-label="設定">⚙️</button>
      <span id="status"></span>
    </header>
    <section id="auth" class="auth">
      <div class="auth-box">
        <h1>somenAI</h1><p>AIと話そう。</p>
        <form id="authForm">
          <input id="username" placeholder="ユーザー名" autocomplete="username" required>
          <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" required>
          <button id="authSubmit" class="primary" type="submit">ログイン</button>
          <button id="authToggle" class="link-button" type="button">新規登録はこちら</button>
          <div id="authError" class="error"></div>
        </form>
      </div>
    </section>
    <section id="chat" class="chat hidden"></section>
    <div id="attachmentPreview" class="attachment-preview hidden"></div>
    <form id="composer" class="composer hidden">
      <button id="attach" class="round-button" type="button" aria-label="画像を添付">＋</button>
      <textarea id="input" rows="1" placeholder="メッセージを入力…" autocomplete="off"></textarea>
      <button id="imageMode" class="round-button" type="button" aria-label="画像生成モード">🎨</button>
      <button id="send" class="send-button" type="submit" aria-label="送信">↑</button>
      <input id="imageInput" type="file" accept="image/*" multiple hidden>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
    </form>
  </main>
</div>
<script src="app.js?v=ui6" defer></script>
<script src="image-fix.js?v=3" defer></script>
</body>
</html>
