<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>somenAI</title><link rel="stylesheet" href="style.css?v=mobile4"><link rel="stylesheet" href="ui.css?v=ui2"><link rel="stylesheet" href="ui2.css?v=ui1"></head>
<body><main class="app"><div id="sidebarBackdrop" class="sidebar-backdrop"></div><aside class="sidebar"><div class="brand">somenAI</div><button id="newChat" class="primary">＋ 新しいチャット</button><div id="chatList" class="chat-list"></div><div class="settings"><label for="provider">AI</label><select id="provider"><option value="auto">自動</option><option value="gemini">Gemini</option><option value="groq">Groq / Qwen</option></select><label class="check"><input id="webSearch" type="checkbox"> Web検索</label><label class="check"><input id="useReferences" type="checkbox"> 参考資料RAG</label><button id="addReference" type="button" class="secondary">＋ 参考資料を追加</button><button id="logout" type="button" class="secondary">ログアウト</button></div></aside><section class="main"><header><button id="mobileMenu" class="mobile-menu" type="button" aria-label="メニュー" aria-expanded="false">☰</button><span>somenAI</span><span id="status" class="status"></span></header><div id="auth" class="auth"><h1>somenAI</h1><p>AIと話そう。</p><form id="authForm"><input id="username" autocomplete="username" placeholder="ユーザー名" required><input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required><button id="authSubmit">ログイン</button><button id="authToggle" type="button" class="link">新規登録はこちら</button><p id="authError" class="error"></p></form></div><div id="chat" class="chat hidden"></div><div id="attachmentPreview" class="attachment hidden"></div><form id="composer" class="composer hidden"><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,image/avif" hidden><button id="attach" type="button" class="attach" aria-label="画像を添付" title="画像を添付">＋</button><textarea id="input" rows="1" placeholder="メッセージを入力…"></textarea><button id="send" type="submit" aria-label="送信">送信</button></form></section></main><script src="app.js?v=mobile4" defer></script><script src="ui.js?v=ui2" defer></script></body></html>
